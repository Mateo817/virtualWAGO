name: Python research backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install own namespace-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Run hardware-free unit tests
        env:
          VIRTUALWAGO_TEST_BWRAP: /usr/bin/bwrap
        # Namespace setup needs the hosted runner's existing sudo. Creating
        # fixtures and memfds in that same process preserves their ownership
        # and descriptors across user-namespace setup. No global policy change.
        # This job runs repository tests as root; isolated children drop all caps.
        run: sudo -n --preserve-env=VIRTUALWAGO_TEST_BWRAP,LD_LIBRARY_PATH -- "$(command -v python)" -m unittest discover -s tests -v
