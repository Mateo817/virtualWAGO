name: Python research backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install own namespace-test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Prepare scoped namespace launcher
        run: |
          # The hosted runner restricts unprivileged loopback setup. Only the
          # namespace launcher uses its existing sudo; Python stays unprivileged.
          # Tests still require private namespaces and drop all child capabilities.
          cat > "$RUNNER_TEMP/virtualwago-ci-bwrap" <<'SH'
          #!/bin/sh
          exec sudo -n -- /usr/bin/bwrap "$@"
          SH
          chmod 700 "$RUNNER_TEMP/virtualwago-ci-bwrap"
          echo "VIRTUALWAGO_TEST_BWRAP=$RUNNER_TEMP/virtualwago-ci-bwrap" >> "$GITHUB_ENV"
      - name: Run hardware-free unit tests
        run: python -m unittest discover -s tests -v
