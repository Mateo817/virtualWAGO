name: Offline Rust workbench

on:
  push:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workbench:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting and native contracts
        working-directory: workbench
        run: |
          cargo fmt --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
      - name: Build browser application
        working-directory: workbench/web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Test browser with local Rust service
        working-directory: workbench/web
        run: |
          npx playwright install --with-deps chromium
          npm test
