[package]
name = "virtualwago-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Local offline I/O simulation workbench; no PLC or hardware connection"

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rhai = { version = "=1.27.0", features = ["sync", "no_module", "no_time"] }
sha2 = "=0.10.9"
tower-http = { version = "=0.7.1", features = ["fs", "limit", "set-header"] }
futures-util = "=0.3.34"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
